id: https://raw.githubusercontent.com/CodyCBakerPhD/website/main/schemas/records
name: records
title: Records Schema
description: >-
  LinkML schema for the machine-readable records that the personal website of
  Cody C. Baker is built from: software projects, curated datasets,
  publications, professional summaries, education, experience and skills.
  Each record is one JSON file under projects/, datasets/, publications/,
  summaries/, education/, experience/ or skills/, and carries its own version
  as well as the version of this schema it was written against. Records can
  cite evidence from outside the site and name one another, such as a
  publication naming the project it is about. The vocabulary of tags is in
  tags.yaml, which this schema imports.
version: 0.9.0

prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  CiTO: http://purl.org/spar/cito/
  dcterms: http://purl.org/dc/terms/
  records: https://raw.githubusercontent.com/CodyCBakerPhD/website/main/schemas/records/

default_prefix: records
default_range: string

imports:
  - linkml:types
  - tags

types:
  SemanticVersion:
    typeof: string
    base: str
    description: A semantic version (MAJOR.MINOR.PATCH), e.g. "0.1.0".
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  PartialDate:
    typeof: string
    base: str
    description: >-
      An ISO 8601 calendar date at year (YYYY), month (YYYY-MM) or day
      (YYYY-MM-DD) precision.
    pattern: "^[0-9]{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?)?$"
  HttpUrl:
    typeof: uri
    description: An absolute http or https URL.
    pattern: "^https?://"
  RecordReference:
    typeof: string
    base: str
    description: >-
      Another record, named by the path of its file from the repository root
      without ".json", e.g. "projects/neuroconv". The site build checks that
      the record exists.
    pattern: "^(projects|datasets|publications)/[a-z0-9]+(-[a-z0-9]+)*$"

slots:
  schema_version:
    description: >-
      Version of this schema the record was written against. The record may
      still be valid under other schema versions; this names the version at
      the time it was written.
    slot_uri: schema:schemaVersion
    range: SemanticVersion
    required: true
  record_version:
    description: >-
      Version of the record's own content, bumped whenever the record changes.
    slot_uri: schema:version
    range: SemanticVersion
    required: true
  name:
    description: Display name of the record.
    slot_uri: schema:name
    required: true
  role:
    description: Role held on the work the record describes.
    slot_uri: schema:roleName
  description:
    description: >-
      Paragraphs of plain text, in which **double asterisks** mark emphasis.
    slot_uri: schema:description
    multivalued: true
    minimum_cardinality: 1
  evidence:
    description: >-
      Links to sources outside this site that back up what the record says,
      such as the pull requests behind a contribution or a page its
      description mentions, e.g. "https://github.com/hdmf-dev/hdmf/pull/672".
      What a GitHub pull request or issue is (its title and state) is fetched
      from GitHub rather than written here.
    slot_uri: CiTO:citesAsEvidence
    range: HttpUrl
    multivalued: true
    list_elements_unique: true
    minimum_cardinality: 1
  built_with:
    description: >-
      Other records of the software this work was built with, such as a
      project it depends on directly or the one that converted a dataset,
      e.g. "projects/neuroconv".
    slot_uri: schema:isBasedOn
    range: RecordReference
    multivalued: true
    list_elements_unique: true
    minimum_cardinality: 1

classes:
  BaseRecord:
    abstract: true
    description: >-
      The fields every record has, and the evidence any record may cite.
    slots:
      - schema_version
      - record_version
      - name
      - tags
      - evidence

  Project:
    is_a: BaseRecord
    description: >-
      A software project and the role held on it. Each record is one JSON file
      under projects/.
    class_uri: schema:SoftwareSourceCode
    slots:
      - role
      - description
      - built_with
    slot_usage:
      name:
        description: Display name of the project.
      role:
        description: Role held on the project, e.g. "Lead Developer" or "Contributor".
        required: true
      description:
        description: >-
          Paragraphs of plain text describing the project and the contributions
          made to it, in which **double asterisks** mark emphasis.
        required: true
    attributes:
      url:
        description: Primary link for the project, such as its source repository or homepage.
        slot_uri: schema:url
        range: HttpUrl
        required: true
      contribution:
        description: >-
          Summary of the contributions made to the project. Required when the
          role is "Contributor".
      start_date:
        description: When involvement in the project began.
        slot_uri: schema:startDate
        range: PartialDate
        required: true
      end_date:
        description: When involvement in the project ended. Omitted while it is ongoing.
        slot_uri: schema:endDate
        range: PartialDate
      logo:
        description: >-
          Path to the project's logo relative to the website root (the file
          itself lives under src/public/), e.g. "img/guide_logo.png".
        slot_uri: schema:logo
        pattern: "^[^/]"
      logo_dark:
        description: >-
          Path to the version of the project's logo it publishes for dark
          backgrounds, in place of logo there, relative to the website root
          like logo, e.g. "img/historia_logo_dark.svg". Omitted when the
          project has no such version.
        pattern: "^[^/]"
      distributions:
        description: >-
          Where the project is distributed for others to install or use, as
          the page of each package index, container registry, release or web
          app, e.g. "https://pypi.org/project/hdmf/". The site names each by
          its address. Omitted for a project that is not distributed, such as
          one run only from its source.
        slot_uri: schema:installUrl
        range: HttpUrl
        multivalued: true
        list_elements_unique: true
        minimum_cardinality: 1
      repositories:
        description: >-
          The GitHub repositories the project is made of, each with its own
          logo if it has one. Its pull requests and issues there are counted
          toward it, as well as those under its url when that is on GitHub.
        slot_uri: schema:codeRepository
        range: Repository
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      replaced_by:
        description: >-
          Other records of the work that has largely replaced this project,
          e.g. "projects/neurosift".
        slot_uri: dcterms:isReplacedBy
        range: RecordReference
        multivalued: true
        list_elements_unique: true
        minimum_cardinality: 1
    rules:
      - description: A contributor's record summarizes what they contributed.
        preconditions:
          slot_conditions:
            role:
              equals_string: Contributor
        postconditions:
          slot_conditions:
            contribution:
              required: true

  Dataset:
    is_a: BaseRecord
    description: >-
      A dataset, or collection of datasets, curated for publication and the
      role held in curating it. Each record is one JSON file under datasets/.
    class_uri: schema:Dataset
    slots:
      - role
      - description
      - built_with
    slot_usage:
      name:
        description: Title of the dataset or collection.
      role:
        description: Role held in curating the data, e.g. "Primary Engineer" or "Supervisor".
        required: true
      description:
        description: >-
          Paragraphs of plain text describing the curation work, in which
          **double asterisks** mark emphasis.
        required: true
    attributes:
      group:
        description: Research group that produced the data, e.g. "Leifer Lab".
        slot_uri: schema:creator
        required: true
      institution:
        description: >-
          Institution the group belongs to, e.g. "Princeton University".
          Omitted for groups that span several institutions.
        slot_uri: schema:sourceOrganization
      modality:
        description: Primary data modality, e.g. "Microscopy" or "Electrophysiology".
        slot_uri: schema:measurementTechnique
        required: true
      links:
        description: Related resources.
        range: DatasetLinks
        inlined: true

  Repository:
    description: A GitHub repository that is part of a project.
    class_uri: schema:SoftwareSourceCode
    attributes:
      url:
        description: >-
          The repository on GitHub, e.g.
          "https://github.com/brain-bbqs/bbqs-uploader". What it is (its
          description) is fetched from GitHub rather than written here.
        slot_uri: schema:codeRepository
        range: HttpUrl
        pattern: "^https://github\\.com/[^/]+/[^/]+$"
        required: true
      logo:
        description: >-
          Path to the repository's logo relative to the website root (the file
          itself lives under src/public/), e.g. "img/bbqs_uploader_logo.svg".
        slot_uri: schema:logo
        pattern: "^[^/]"
      homepage:
        description: >-
          The website the repository serves, such as its web app, e.g.
          "https://usage.dandiarchive.org". A repository with a homepage is
          listed as that website rather than as code, by its title.
        slot_uri: schema:url
        range: HttpUrl
      title:
        description: >-
          Display name of the website the repository serves, such as the
          site's own page title, e.g. "Dandiset Usage Summaries". Required
          with a homepage; a repository without one is named by its own name.
        slot_uri: schema:name

  DatasetLinks:
    description: Resources related to a dataset, keyed by type.
    attributes:
      manuscript:
        description: The associated publication, ideally as a DOI link.
        slot_uri: schema:citation
        range: HttpUrl
      dataset:
        description: The published data, e.g. a Dandiset on the DANDI Archive.
        slot_uri: schema:url
        range: HttpUrl
      notebook:
        description: Jupyter Notebook(s) demonstrating how to access and analyze the data.
        range: HttpUrl
      code:
        description: Source code that converted the data to a standard format.
        slot_uri: schema:isBasedOn
        range: HttpUrl

  Publication:
    is_a: BaseRecord
    description: >-
      A scholarly work: an article, a conference presentation or a workshop.
      Each record is one JSON file under publications/.
    class_uri: schema:CreativeWork
    slots:
      - description
    slot_usage:
      name:
        description: Title of the work, without a trailing period.
      description:
        description: >-
          Paragraphs of plain text summarizing the work, in which **double
          asterisks** mark emphasis.
    attributes:
      kind:
        description: What kind of work it is.
        range: PublicationKind
        required: true
      authors:
        description: >-
          Authors in citation order, as initials and surname, e.g. "C. J.
          Gillon". Lists only the leading authors when et_al is true.
        slot_uri: schema:author
        multivalued: true
        required: true
        minimum_cardinality: 1
      et_al:
        description: >-
          Whether further authors follow those listed. Set only for works with
          more than 10 authors; otherwise list every author.
        range: boolean
      date:
        description: >-
          When the work was published or presented, or last dated while in
          preparation.
        slot_uri: schema:datePublished
        range: PartialDate
        required: true
      venue:
        description: >-
          Where the work appeared, as cited after its title and without a
          trailing period: the journal and issue, the conference, or the event
          and its host, e.g. "eNeuro, vol. 12, no. 11". "In preparation" for a
          manuscript not yet published.
        required: true
      note:
        description: >-
          A remark on how the work was presented or selected, without a
          trailing period, e.g. "Poster (top 43% of abstracts)".
      doi:
        description: The work's DOI, as a link, e.g. "https://doi.org/10.25080/cehj4257".
        slot_uri: schema:sameAs
        range: HttpUrl
        pattern: "^https://doi\\.org/10\\."
      about:
        description: >-
          Other records of the work this one presents, describes or teaches,
          e.g. "projects/neuroconv".
        slot_uri: schema:about
        range: RecordReference
        multivalued: true
        list_elements_unique: true
        minimum_cardinality: 1

  Summary:
    description: >-
      A professional summary: the few paragraphs that introduce Cody C. Baker
      as a whole, such as the About section of the website or the Summary of a
      CV. Each record is one JSON file under summaries/.
    slots:
      - schema_version
      - record_version
      - description
    slot_usage:
      description:
        description: >-
          Paragraphs of plain text in implied first person, in which **double
          asterisks** mark emphasis. A one-page resume shows only the first
          sentence of each paragraph, so each should lead with its main point.
        required: true

  Education:
    description: >-
      A degree earned. Each record is one JSON file under education/.
    class_uri: schema:EducationalOccupationalCredential
    slots:
      - schema_version
      - record_version
    attributes:
      degree:
        description: The degree, abbreviated, e.g. "Ph.D." or "B.S.".
        slot_uri: schema:credentialCategory
        required: true
      majors:
        description: >-
          What the degree is in, each with its program's or department's
          abbreviation and website where it has them.
        slot_uri: schema:educationalProgramMode
        range: LinkedName
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      minors:
        description: Minors earned alongside the degree, e.g. "Computer Science".
        multivalued: true
        minimum_cardinality: 1
      institution:
        description: The university that awarded the degree, e.g. "University of Notre Dame".
        slot_uri: schema:recognizedBy
        required: true
      start_date:
        description: When study toward the degree began.
        slot_uri: schema:startDate
        range: PartialDate
        required: true
      end_date:
        description: When the degree was awarded.
        slot_uri: schema:endDate
        range: PartialDate
        required: true
      research:
        description: The research done toward the degree, and the group it was done with.
        range: Research
        inlined: true
      theses:
        description: Theses written for the degree.
        range: Thesis
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      coursework:
        description: >-
          Courses taken toward the degree that bear on later work, as lowercase
          topics, e.g. "machine learning".
        multivalued: true
        minimum_cardinality: 1

  Research:
    description: Research done toward a degree.
    attributes:
      kind:
        description: What kind of research it was, e.g. "Doctoral".
      group:
        description: The research group it was done with.
        range: LinkedName
        inlined: true
        required: true

  Thesis:
    description: A thesis written for a degree.
    class_uri: schema:Thesis
    attributes:
      kind:
        description: What kind of thesis it is, e.g. "Doctoral", "Senior" or "Honors".
        required: true
      title:
        description: Its title, without quotation marks.
        slot_uri: schema:name
        required: true
      url:
        description: Where it is published.
        slot_uri: schema:url
        range: HttpUrl

  Position:
    description: >-
      A job or appointment held. Each record is one JSON file under
      experience/.
    class_uri: schema:EmployeeRole
    slots:
      - schema_version
      - record_version
      - description
    slot_usage:
      description:
        description: >-
          Paragraphs of plain text, each one responsibility or accomplishment,
          in which **double asterisks** mark emphasis. A CV shows each as a
          bullet.
        required: true
    attributes:
      title:
        description: The position's title, e.g. "Research Software Engineer".
        slot_uri: schema:roleName
        required: true
      organization:
        description: The company, group or department worked for.
        slot_uri: schema:memberOf
        range: LinkedName
        inlined: true
        required: true
      departments:
        description: >-
          Departments the organization belongs to or works with, e.g. a
          university's, in the order they are listed.
        range: LinkedName
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      institution:
        description: >-
          The university or other institution the organization belongs to,
          e.g. "Dartmouth College".
        slot_uri: schema:parentOrganization
      course:
        description: The course taught, for a teaching position, e.g. "Applied Mathematical Methods".
      arrangement:
        description: Where the work was done from, when a source says.
        range: WorkArrangement
      start_date:
        description: When the position began.
        slot_uri: schema:startDate
        range: PartialDate
        required: true
      end_date:
        description: When the position ended. Omitted while it is held.
        slot_uri: schema:endDate
        range: PartialDate

  LinkedName:
    description: >-
      Something a record names, such as an organization, department or
      program of study, with the abbreviation it goes by and its website where
      it has them.
    slots:
      - name
    slot_usage:
      name:
        description: Its full name, e.g. "Center for Open Neuroscience".
    attributes:
      abbreviation:
        description: The abbreviation it goes by, e.g. "CON".
        slot_uri: schema:alternateName
      url:
        description: Its website.
        slot_uri: schema:url
        range: HttpUrl

  SkillGroup:
    description: >-
      A group of related skills, listed either directly or in labeled
      subgroups. Each record is one JSON file under skills/.
    class_uri: schema:DefinedTermSet
    slots:
      - schema_version
      - record_version
      - name
    slot_usage:
      name:
        description: Name of the group, e.g. "Mathematical / Statistical / Machine Learning Techniques".
    attributes:
      short_name:
        description: >-
          A shorter name, where space is tight, such as a CV's left column,
          e.g. "Math, stats, & ML". Omitted when the name is short enough.
      note:
        description: >-
          A remark on how the skills are listed, without parentheses, e.g. "in
          order of experience".
      skills:
        description: >-
          The skills, in the order they are listed, each by its own spelling,
          e.g. "TypeScript" or "pandas".
        multivalued: true
        list_elements_unique: true
        minimum_cardinality: 1
      subgroups:
        description: The group's skills in labeled subgroups, in place of skills.
        range: SkillSubgroup
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    exactly_one_of:
      - slot_conditions:
          skills:
            required: true
      - slot_conditions:
          subgroups:
            required: true

  SkillSubgroup:
    description: A labeled part of a skill group, e.g. "Linting" among frameworks.
    slots:
      - name
    slot_usage:
      name:
        description: Label of the subgroup, e.g. "Linting".
    attributes:
      skills:
        description: The subgroup's skills, in the order they are listed.
        multivalued: true
        list_elements_unique: true
        required: true
        minimum_cardinality: 1

enums:
  WorkArrangement:
    description: Where work was done from.
    permissible_values:
      on_site:
        description: At the organization's site.
      hybrid:
        description: Partly on site and partly remotely.
      remote:
        description: Remotely.

  PublicationKind:
    description: The kinds of scholarly work a Publication can be.
    permissible_values:
      article:
        description: A journal article, conference paper or manuscript.
        meaning: schema:ScholarlyArticle
      presentation:
        description: A talk or poster at a conference.
        meaning: schema:PresentationDigitalDocument
      workshop:
        description: A tutorial, hackathon or workshop session led or co-led.
        meaning: schema:EducationEvent
