name: Daily link checker

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/daily_link_checker.yml"
      - ".github/actions/**"

jobs:
  check_links:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      # The pages are checked as built, so the links the build assembles from
      # records, and those between pages, are covered as well. The CV and
      # resume are built too, since the home page links to their PDFs.
      - name: Build the site
        uses: ./.github/actions/build-site

      # dist/ is gitignored, which lychee would otherwise skip. The site links
      # to its pages without '.html', which the fallback extension resolves.
      # GitHub search links are generated from queries rather than written,
      # and LinkedIn and npm refuse automated requests.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --no-ignore
            --timeout 30
            --max-retries 5
            --retry-wait-time 5
            --accept '100..=103,200..=299,429,502,504'
            --fallback-extensions html
            --exclude '^https://github\.com/search\?'
            --exclude '^https://www\.linkedin\.com/'
            --exclude '^https://www\.npmjs\.com/'
            'dist/*.html'
            '*.md'
            'docs/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_on_failure:
    runs-on: ubuntu-latest
    permissions: {}
    needs: [check_links]
    if: ${{ always() && needs.check_links.result == 'failure' && github.event_name != 'pull_request' }}
    steps:
      - name: Email the failure
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: Website Daily Link Checker"
          to: cody.c.baker.phd@gmail.com
          from: Website <website@users.noreply.github.com>
          body: "The daily link checker workflow failed, please check status at https://github.com/CodyCBakerPhD/website/actions/workflows/daily_link_checker.yml"
