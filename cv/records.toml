# The rubrics of the full CV and the one-page resume under cv/ that
# scripts/render_cv.py renders from this repository's records.
#
# Each [[section]] writes one LaTeX rubric, `output` (relative to cv/), from
# one directory of records, `records` ("summaries", "projects", "datasets" or
# "publications"). `show` lists the record IDs (file names without .json) in
# the order the resume shows them; `omit` lists those it deliberately leaves
# out. Every record must appear in exactly one of the two, so adding a record
# means placing it here too. A section of summaries shows exactly one.
#
# `compact = true` renders the short form of a one-page resume: no intro, only
# the first sentence of each description (of each paragraph, for a summary),
# and publications without the headings for their kinds.
#
# The full CV shows every record, in the order the website lists them (the
# section lists in src/build/sections.ts), and the summary its About section
# shows.

[[section]]
output = "full_styled/summary.tex"
records = "summaries"
show = ["general"]
omit = []

[[section]]
output = "one_page/summary.tex"
records = "summaries"
compact = true
show = ["general"]
omit = []

[[section]]
output = "full_styled/projects.tex"
records = "projects"
show = [
    "hearth",
    "ember-archive",
    "dandi-archive",
    "s3-log-extraction",
    "nwb-guide",
    "neuroconv",
    "neurosift",
