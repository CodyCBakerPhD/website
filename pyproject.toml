# Settings for the Python tools that .pre-commit-config.yaml runs over scripts/.
# The repository is not a Python package; the scripts are written to 120 columns
# and run on the Python that .github/workflows/validate_records.yml installs.

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# The rule families the 2026-11-08 code quality review swept the scripts with
# (docs/code-reviews/2026-11-08-code-quality-review.md, CL-11).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "A", "UP", "C4", "SIM", "PERF", "RUF", "EXE", "PIE", "RET"]

[tool.codespell]
# "nd" is the University of Notre Dame's domain in the home page's links.
uri-ignore-words-list = "nd"
